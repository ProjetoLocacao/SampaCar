{% extends "base.html" %}
{% block title %}Perfil{% endblock %}
{% block content %}
<div class="profile-container">
    <h2>Meu Perfil</h2>
    <form method="POST" class="profile-form" id="formPerfil">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" value="{{ perfil.nome or '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" value="{{ perfil.email or '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" value="{{ perfil.telefone or '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="endereco">Endereço:</label>
            <textarea id="endereco" name="endereco" rows="3">{{ perfil.endereco or '' }}</textarea>
        </div>
        
        <div id="mensagem" class="mensagem"></div>
        
        <button type="submit" class="btn-primary">Salvar Perfil</button>
    </form>
</div>
{% endblock %}
